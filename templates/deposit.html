{% extends "base.html" %}
{% block content %}
<div class="form-box">
    <h2>Cash Deposit</h2>
    <form method="POST">
        <div class="form-group">
            <label>Amount ($)</label>
            <input type="number" step="0.01" name="amount" min="1" required>
        </div>
        <button type="submit" class="btn">Deposit</button>
        <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
