{% extends "base.html" %}
{% block content %}
<div id="withdraw-flow">
    <!-- Screen 1: Select Amount -->
    <div id="screen-select" class="atm-transaction-screen active">
        <h2 class="text-center">SELECT WITHDRAWAL AMOUNT</h2>
        <div class="menu-options mt-4">
            <div class="menu-row">
                <button class="menu-btn l-btn" onclick="processWithdraw(500)">[ ₹ 500 ]</button>
                <button class="menu-btn r-btn" onclick="processWithdraw(5000)">[ ₹ 5,000 ]</button>
            </div>
            <div class="menu-row">
                <button class="menu-btn l-btn" onclick="processWithdraw(1000)">[ ₹ 1,000 ]</button>
                <button class="menu-btn r-btn" onclick="processWithdraw(10000)">[ ₹ 10,000 ]</button>
            </div>
            <div class="menu-row">
                <button class="menu-btn l-btn" onclick="processWithdraw(2000)">[ ₹ 2,000 ]</button>
                <button class="menu-btn r-btn" onclick="showCustomAmount()">[ OTHER AMOUNT ]</button>
            </div>
            <div class="menu-row exit-row">
                <a href="{{ url_for('dashboard') }}" class="menu-btn l-btn cancel-btn">[ CANCEL ]</a>
            </div>
        </div>
    </div>

    <!-- Screen 2: Custom Amount -->
    <div id="screen-custom" class="atm-transaction-screen text-center" style="display:none;">
        <h2>ENTER AMOUNT</h2>
        <p>Multiples of ₹100 only</p>
        <div class="mt-4">
            <div class="amount-input-container">
                <span class="currency">₹</span>
                <input type="text" id="custom-amount-input" class="atm-input text-right" readonly value="0">
            </div>
        </div>
        <div class="menu-options mt-4" style="position: absolute; bottom: 20px; width: 100%;">
            <div class="menu-row" style="justify-content: space-between; padding: 0 20px;">
                <button class="menu-btn l-btn cancel-btn" onclick="cancelCustomAmount()">[ CANCEL ]</button>
                <button class="menu-btn r-btn" onclick="submitCustomAmount()">[ CONFIRM ]</button>
            </div>
        </div>
    </div>
    
    <!-- Screen 3: Processing -->
    <div id="screen-processing" class="atm-transaction-screen text-center" style="display:none;">
        <div class="spinner mt-4"></div>
        <h2 class="mt-4 blinking-text">PROCESSING TRANSACTION...</h2>
        <p>Please wait while we dispense your cash</p>
    </div>
</div>

<form id="withdraw-form" method="POST" action="{{ url_for('withdraw') }}" style="display:none;">
    <input type="hidden" name="amount" id="hidden_amount">
</form>
{% endblock %}

{% block scripts %}
<script>
    let customAmount = "0";
    let isCustom = false;

    window.addEventListener('atm-key', (e) => {
        if(!isCustom) return;
        const val = e.detail.key;
        if(/[0-9]/.test(val)) {
            if(customAmount === "0") customAmount = val;
            else if(customAmount.length < 6) customAmount += val;
            updateCustomAmount();
        } else if (val === 'CLEAR') {
            customAmount = "0";
            updateCustomAmount();
        } else if (val === 'CANCEL') {
            cancelCustomAmount();
        } else if (val === 'ENTER') {
            submitCustomAmount();
        }
    });

    function showCustomAmount() {
        atmSound('beep');
        isCustom = true;
        customAmount = "0";
        updateCustomAmount();
        document.getElementById('screen-select').style.display = 'none';
        document.getElementById('screen-custom').style.display = 'block';
    }

    function cancelCustomAmount() {
        atmSound('beep');
        isCustom = false;
        document.getElementById('screen-custom').style.display = 'none';
        document.getElementById('screen-select').style.display = 'block';
    }

    function updateCustomAmount() {
        document.getElementById('custom-amount-input').value = customAmount;
    }

    function submitCustomAmount() {
        const amt = parseInt(customAmount);
        if(amt > 0 && amt % 100 === 0) {
            processWithdraw(amt);
        } else {
            atmSound('error');
            alert("Amount must be multiple of 100");
        }
    }

    function processWithdraw(amount) {
        atmSound('processing');
        isCustom = false;
        document.getElementById('screen-select').style.display = 'none';
        document.getElementById('screen-custom').style.display = 'none';
        document.getElementById('screen-processing').style.display = 'block';
        
        document.getElementById('hidden_amount').value = amount;
        
        // Simulate hardware cash dispenser animation
        setTimeout(() => {
            atmSound('cash');
            const dispenser = document.getElementById('cash-slot-light');
            if(dispenser) {
                dispenser.style.background = '#00ffcc';
                dispenser.style.boxShadow = '0 0 10px #00ffcc';
            }
            const notes = document.getElementById('cash-notes');
            if(notes) {
                notes.style.display = 'block';
                setTimeout(()=> { notes.style.top = '10px'; }, 50);
            }
        }, 1500);

        setTimeout(() => {
            document.getElementById('withdraw-form').submit();
        }, 4000);
    }
</script>
{% endblock %}
