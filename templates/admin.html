{% extends "base.html" %}
{% block content %}
<div class="admin-dashboard">
    <h2>Admin Panel</h2>
    <h3>All Users</h3>
    <table class="table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Card Number</th>
                <th>Balance</th>
            </tr>
        </thead>
        <tbody>
            {% for u in users %}
            <tr>
                <td>{{ u.id }}</td>
                <td>{{ u.name }}</td>
                <td>{{ u.card_number }}</td>
                <td>${{ "%.2f"|format(u.balance) }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
